<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="darkreader-lock" content="is">
    <title>doup</title>
    <script type="module" src="../ts/upload.ts" async></script>
    <script type="module" src="../ts/drag_and_drop.ts" async></script>
    <link rel="stylesheet" href="../scss/style.scss">
    <link rel="stylesheet" href="../scss/button.scss">
</head>

<body>
    <div>
        <label id="drop-zone">
            <span id="preview">Lachez l'archive ici, ou clickez pour l'upload.</span>
            <input type="file" id="file-input"
                accept=".zip,.tar,.tar.gz,.tgz,.7z,.rar,.gz,application/zip,application/x-tar,application/gzip,application/x-7z-compressed" />
        </label>
        <div id="btn-div">
            <!-- From Uiverse.io by satyamchaudharydev -->
            <div class="button" id="clear-btn">
                <div class="button-wrapper">
                    <div class="text">Vider</div>
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                    </span>
                </div>
            </div>

            <!-- From Uiverse.io by satyamchaudharydev -->
            <div class="button" id="submit">
                <div class="button-wrapper">
                    <div class="text">Upload</div>
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="2em" height="2em"
                            preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17">
                            </path>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
